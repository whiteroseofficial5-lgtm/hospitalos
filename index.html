<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhiteRose HospitalOS - Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%230c2b3e'/%3E%3Ccircle cx='24' cy='22' r='7' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<style>:root{
  --navy:#0c2b3e; --navy2:#12384f; --green:#0f4a3f; --teal:#0f9b8e; --teal-d:#0b7a70; --teal-l:#e0f4f1;
  --bg:#f4f6f8; --card:#fff; --line:#e3e8ee; --ink:#14232f; --mut:#617384;
  --ok:#17803d; --okbg:#e3f5ea; --warn:#a36200; --warnbg:#fdf0d5; --bad:#b4283c; --badbg:#fbe5e8; --info:#1d5fa8; --infobg:#e2eefb;
  --r:10px; --sh:0 1px 2px rgba(12,43,62,.06),0 4px 14px rgba(12,43,62,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
a{color:var(--teal-d);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hide{display:none!important}
.mut{color:var(--mut)} .sm{font-size:12px} .b{font-weight:600} .r{text-align:right} .mono{font-variant-numeric:tabular-nums}

/* login */
#login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,520px);background:var(--card)}
.login-art{background:linear-gradient(160deg,var(--navy) 0%,var(--green) 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art svg.bgrose{position:absolute;right:-90px;bottom:-90px;width:520px;opacity:.07}
.login-art h1{font-size:40px;line-height:1.1;max-width:14em;margin-top:28px}
.login-art p{max-width:30em;color:#bfe3de;font-size:16px}
.login-art ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:10px;color:#d8efec}
.login-art li:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:10px}
.login-form{padding:56px 48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.demo-chip{display:inline-block;background:var(--warnbg);color:var(--warn);border:1px solid #efd596;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:.04em}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolebtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;text-align:left;cursor:pointer}
.rolebtn:hover{border-color:var(--teal);background:var(--teal-l)}
.rolebtn b{display:block;font-size:13px}.rolebtn span{font-size:12px;color:var(--mut)}
@media(max-width:860px){#login{grid-template-columns:1fr}.login-art{padding:32px}.login-art h1{font-size:28px}.login-form{padding:28px 22px}}

/* shell */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
#side{background:var(--navy);color:#cfe1e8;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{color:#fff;font-size:16px;display:block;line-height:1.1}.brand span{font-size:11px;color:#8fb4bf}
#nav{padding:10px;display:grid;gap:2px;flex:1}
#nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left}
#nav button:hover{background:rgba(255,255,255,.07)}
#nav button.on{background:var(--teal);color:#fff;font-weight:600}
#nav svg{width:18px;height:18px;flex:none}
.side-foot{padding:12px 16px;font-size:11px;color:#7fa3af;border-top:1px solid rgba(255,255,255,.08)}
#main{min-width:0;display:flex;flex-direction:column}
#top{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:5}
#top .grow{flex:1}
#menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.search{display:flex;gap:6px;max-width:380px;width:100%}
.user{display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
#view{padding:24px;max-width:1400px;width:100%}
.demo-bar{background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:600;text-align:center;padding:4px;border-bottom:1px solid #efd596}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:-260px;width:250px;z-index:30;transition:left .2s}
  #side.open{left:0}
  #menu{display:block} #view{padding:16px} #top{padding:10px 14px}
  .user .who{display:none}
}

/* components */
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:3px 0 0;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.g2,.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card>.ch{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card>.cb{padding:16px 18px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;border-left:4px solid var(--teal)}
.kpi:hover{background:#fafcfc}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi.w{border-left-color:#e0a21a}.kpi.d{border-left-color:var(--bad)}.kpi.n2{border-left-color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:#b9c6d1;background:#f8fafb}
.btn.p{background:var(--teal);border-color:var(--teal);color:#fff}.btn.p:hover{background:var(--teal-d)}
.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}.btn.n:hover{background:var(--navy2)}
.btn.d{color:var(--bad);border-color:#efc0c8}.btn.s{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid #cdd6df;border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(15,155,142,.15)}
label{display:grid;gap:4px;font-size:12.5px;color:var(--mut);font-weight:550}
textarea{min-height:72px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:9px 12px;background:#f8fafb;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #eef2f5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#fafcfc}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef2f5;color:#41576a;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.info{background:var(--infobg);color:var(--info)}.badge.teal{background:var(--teal-l);color:var(--teal-d)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--teal)}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.bar{height:8px;background:#e8eef2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.bar.w i{background:#e0a21a}.bar.d i{background:var(--bad)}
.note{background:var(--infobg);color:#16477f;border-radius:8px;padding:9px 12px;font-size:13px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* beds */
.ward{margin-bottom:18px}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bed{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:12.5px;min-height:78px}
.bed.free{border-color:#9ad8cf;background:#f1fbf9;cursor:pointer}.bed.free:hover{background:var(--teal-l)}
.bed.occ{border-color:#f0b9c1;background:#fff7f8}.bed.mnt{background:#f3f4f6;color:var(--mut)}
.bed b{display:block;font-size:13px}

/* queue */
.token{display:inline-grid;place-items:center;min-width:42px;height:34px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;padding:0 8px}

/* charts */
.chart{width:100%;height:190px}
.chart text{font-size:10.5px;fill:#617384}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(12,43,62,.5);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:14px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg.wide{width:min(980px,100%)}
.dlg>.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.dlg>.db{padding:20px}.dlg>.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:340px}
.toast.err{background:var(--bad)}.toast.ok{background:var(--green)}

/* patient card + print docs */
.idcard{width:340px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid #cfd9e1;box-shadow:var(--sh);font-size:12.5px}
.idcard .top{background:linear-gradient(120deg,var(--navy),var(--green));color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center}
.idcard .top b{display:block;font-size:13.5px;line-height:1.15}.idcard .top span{font-size:11px;color:#a9d6cf}
.idcard .mid{padding:14px 16px;display:flex;gap:14px;align-items:center}
.idcard .qr{width:104px;height:104px;flex:none}.idcard .qr svg{width:100%;height:100%}
.idcard .pid{font-size:17px;font-weight:700;color:var(--navy);letter-spacing:.02em}
.idcard .foot{padding:8px 16px;background:#f4f6f8;color:var(--mut);font-size:11px;border-top:1px dashed #cfd9e1}
.doc{background:#fff;padding:28px;color:#000;font-size:13px}
.doc .dh2{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.doc h2{font-size:19px;color:var(--navy)}
.doc table{width:100%;border-collapse:collapse;margin:10px 0}.doc th,.doc td{border-bottom:1px solid #d9e0e6;padding:6px 8px;text-align:left}
.doc .tot{margin-left:auto;width:260px}.doc .tot td{border:0;padding:3px 8px}
.doc .sig{margin-top:44px;display:flex;justify-content:space-between;color:#555}
.watermark{font-size:11px;color:#888;margin-top:18px;text-align:center}

@media print{
  body{background:#fff}
  #side,#top,.demo-bar,#toasts,.noprint,.dlg>.dh,.dlg>.df{display:none!important}
  #app{display:block} body:has(#modal) #app{display:none}
  #modal{position:static;background:none;padding:0;display:block}
  .dlg{box-shadow:none;max-height:none;width:100%}
  .dlg>.db{padding:0}
  .idcard{box-shadow:none}
}
</style></head>
<body>
<div id="login"></div><div id="app" class="hide"></div><div id="toasts" aria-live="polite"></div>
<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      for (var i = 0; i < rsBlocks.length; i += 1) {

  o = o || {}; const w = 520, h = 190, pl = 40, pb = 26, pt = 10; const max = Math.max(1, ...series.flatMap(s => s.v)); const step = (w - pl - 10) / Math.max(1, labels.length - 1);

  const lines = series.map(s => { const pts = s.v.map((v, i) => [pl + i * step, pt + (h - pb - pt) * (1 - v / max)]); return `<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${pts.map(p => p.join(',')).join(' ')}"/>` + pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.c}"><title>${esc(labels[i])}: ${o.fmt ? o.fmt(s.v[i]) : s.v[i]}</title></circle>`).join(''); }).join('');
  const xl = labels.map((l, i) => `<text x="${pl + i * step}" y="${h - 9}" text-anchor="middle">${esc(l)}</text>`).join('');

}

def('savePatient', () => {
  need('patient.create'); const f = fv('pf');
  if (f.name.length < 3) throw new VErr('Enter the patient\'s full name.');
  if (!f.dob) throw new VErr('Enter the date of birth.');
  if (!/^[6-9]\d{9}$/.test(f.phone)) throw new VErr('Enter a valid 10-digit mobile number.');
  if (!f.emergencyName || !/^\d{10}$/.test(f.emergencyPhone)) throw new VErr('Add an emergency contact name and a 10-digit number.');
  const dup = db.patients.find(p => p.phone === f.phone && p.name.toLowerCase() === f.name.toLowerCase());
  if (dup) throw new VErr('This patient may already exist as ' + dup.id + '. Open the existing record instead.');
  const p = { id:nextId(db, 'patient'), name:f.name, gender:f.gender, dob:f.dob, phone:f.phone, email:f.email, bloodGroup:f.bloodGroup, address:f.address, emergencyName:f.emergencyName, emergencyPhone:f.emergencyPhone, allergies:f.allergies || 'None known', history:f.history || 'None', createdAt:todayStr(), token:Math.random().toString(36).slice(2, 10) };

    ${walkin ? '<div class="note" style="margin-top:12px">Walk-ins are booked for now and checked in straight away. A token number is issued.</div>' : ''}
    ${!pid && walkin ? `<p class="sm mut">New patient? <a href="#" onclick="closeModal();A.newPatient();return false">Register them first</a>.</p>` : ''}`,
    footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.saveAppt(${walkin ? 'true' : 'false'})">${walkin ? 'Register walk-in' : 'Book appointment'}</button>` });
});
function issueToken(docId, date) { const k = docId + date; db.tokens[k] = (db.tokens[k] || 0) + 1; return db.tokens[k]; }
def('saveAppt', walkin => {
  need('appt.book'); const f = fv('af');
  if (!f.patient) throw new VErr('Select a patient.'); if (!f.reason) throw new VErr('Enter the reason for the visit.');
  const date = walkin ? todayStr() : f.date; const time = walkin ? new Date().toTimeString().slice(0, 5) : f.time;
  if (!date || date < todayStr()) throw new VErr('Choose today or a future date.');
  if (!walkin && db.appointments.some(a => a.doctor === f.doctor && a.date === date && a.time === time && a.status !== 'Cancelled')) throw new VErr('That slot is already booked for this doctor. Pick another time.');
  if (db.appointments.some(a => a.patient === f.patient && a.date === date && ['Booked', 'Checked-in', 'In consultation'].includes(a.status) && a.doctor === f.doctor)) throw new VErr('This patient already has an appointment with this doctor on that day.');
  const a = { id:nextId(db, 'appointment'), patient:f.patient, doctor:f.doctor, date, time, type: walkin ? 'Walk-in' : 'Scheduled', reason:f.reason, status: walkin ? 'Checked-in' : 'Booked', token: walkin ? issueToken(f.doctor, date) : null, visit:null, createdAt:todayStr() };
  db.appointments.push(a); audit(walkin ? 'Walk-in registered' : 'Appointment booked', a.id); save(); closeModal(); route = { m:'appointments', p:{} }; ST.atab = date === todayStr() ? 'today' : 'upcoming'; render();
  toast(walkin ? 'Walk-in checked in. Token ' + a.token : 'Appointment ' + a.id + ' booked for ' + fdate(date) + ' at ' + time, 'ok');
});
def('checkin', id => { need('appt.checkin'); const a = byId(db.appointments, id); if (a.date !== todayStr()) throw new VErr('Check-in is only possible on the day of the appointment (' + fdate(a.date) + ').'); a.status = 'Checked-in'; a.token = a.token || issueToken(a.doctor, a.date); audit('Patient checked in', a.id); commit('Checked in. Token ' + a.token + ' for ' + DOC(a.doctor).name); });
def('cancelAppt', id => { need('appt.cancel'); const a = byId(db.appointments, id); a.status = 'Cancelled'; audit('Appointment cancelled', id); commit('Appointment cancelled', 'ok'); });

/* ---------------- OPD + consultation (EMR) ---------------- */
VIEWS.opd = () => {
  const t = todayStr(); const mine = session.role === 'doctor' ? session.doctorId : (ST.opdDoc || '');
  let q = db.appointments.filter(a => a.date === t && ['Checked-in', 'In consultation'].includes(a.status) && (!mine || a.doctor === mine)).sort((a, b) => (a.token || 0) - (b.token || 0));
  const done = db.appointments.filter(a => a.date === t && a.status === 'Completed' && (!mine || a.doctor === mine));
  return `<div class="head"><div><h1>OPD and consultations</h1><p>${session.role === 'doctor' ? esc(DOC(session.doctorId).name) + ' - your queue for today' : 'Patients waiting today'}</p></div>
    ${session.role !== 'doctor' ? `<label style="width:260px">Doctor<select onchange="ST.opdDoc=this.value;render()"><option value="">All doctors</option>${opt(db.doctors, d => d.id, d => d.name, mine)}</select></label>` : ''}</div>
  <div class="card" style="margin-bottom:16px"><div class="ch"><h3>Waiting (${q.length})</h3></div>${table(['Token', 'Patient', 'Doctor', 'Reason', 'Status', ''], q.map(a => [`<span class="token">${a.token}</span>`, pLink(a.patient), esc(DOC(a.doctor).name), esc(a.reason), badge(a.status),
      `<div class="row">${can('vitals') ? `<button class="btn s" onclick="A.vitals('${a.id}')">Vitals</button>` : ''}${can('consult') ? `<button class="btn s p" onclick="A.startConsult('${a.id}')">${a.status === 'In consultation' ? 'Continue' : 'Start consultation'}</button>` : ''}</div>`]), 'Nobody is waiting', 'Patients appear here after check-in at reception.')}</div>
  <div class="card"><div class="ch"><h3>Seen today (${done.length})</h3></div>${table(['Patient', 'Doctor', 'Diagnosis', ''], done.map(a => { const v = byId(db.visits, a.visit) || {}; return [pLink(a.patient), esc(DOC(a.doctor).name), esc(v.diagnosis || '-'), a.visit ? `<button class="btn s" onclick="A.visitSummary('${a.visit}')">Visit summary</button>` : '']; }), 'No consultations completed yet')}</div>`;
};
def('vitals', id => {
  need('vitals'); const a = byId(db.appointments, id); const v = a.vitals || {};
  openModal({ title:'Record vital signs - ' + P(a.patient).name, body:`<div id="vf" class="form">${field('Blood pressure', `<input name="bp" placeholder="120/80" value="${esc(v.bp || '')}">`)}${field('Pulse (per min)', `<input name="pulse" type="number" value="${esc(v.pulse || '')}">`)}${field('Temperature (F)', `<input name="temp" type="number" step="0.1" value="${esc(v.temp || '')}">`)}${field('SpO2 (%)', `<input name="spo2" type="number" value="${esc(v.spo2 || '')}">`)}${field('Weight (kg)', `<input name="weight" type="number" value="${esc(v.weight || '')}">`)}</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.saveVitals('${id}')">Save vitals</button>` });
});
def('saveVitals', id => { need('vitals'); const f = fv('vf'); if (!/^\d{2,3}\/\d{2,3}$/.test(f.bp)) throw new VErr('Enter blood pressure like 120/80.'); const a = byId(db.appointments, id); a.vitals = { bp:f.bp, pulse:+f.pulse || 0, temp:+f.temp || 0, spo2:+f.spo2 || 0, weight:+f.weight || 0 }; audit('Vitals recorded', id); closeModal(); commit('Vitals saved'); });
def('startConsult', id => { need('consult'); const a = byId(db.appointments, id); if (session.role === 'doctor' && a.doctor !== session.doctorId) throw new VErr('This patient is booked with ' + DOC(a.doctor).name + '.'); a.status = 'In consultation'; save(); route = { m:'consult', p:{ id } }; ST.rxRows = 1; render(); window.scrollTo(0, 0); });
VIEWS.consult = ({ id }) => {
  const a = byId(db.appointments, id); const p = P(a.patient); const v = a.vitals || {}; const old = db.visits.filter(x => x.patient === p.id).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 3);
  const rows = ST.rxRows || 1;
  return `<div class="head"><div><a href="#" onclick="A.go('opd');return false" class="sm">Back to queue</a><h1>Consultation: ${esc(p.name)}</h1><p><span class="mono">${p.id}</span> | ${age(p.dob)} yrs, ${esc(p.gender)} | token ${a.token} | ${esc(DOC(a.doctor).name)}</p></div></div>
  <div class="grid g21"><div class="grid" id="cf">
    <div class="card"><div class="ch"><h3>Vital signs</h3></div><div class="cb form">${field('Blood pressure', `<input name="bp" value="${esc(v.bp || '')}" placeholder="120/80">`)}${field('Pulse', `<input name="pulse" type="number" value="${esc(v.pulse || '')}">`)}${field('Temp (F)', `<input name="temp" type="number" step="0.1" value="${esc(v.temp || '')}">`)}${field('SpO2 %', `<input name="spo2" type="number" value="${esc(v.spo2 || '')}">`)}${field('Weight kg', `<input name="weight" type="number" value="${esc(v.weight || '')}">`)}</div></div>
    <div class="card"><div class="ch"><h3>Clinical notes</h3></div><div class="cb form">${field('Symptoms *', `<textarea name="symptoms">${esc(a.reason)}</textarea>`, 'full')}${field('Examination notes', '<textarea name="notes"></textarea>', 'full')}${field('Diagnosis *', '<input name="diagnosis" placeholder="e.g. Viral fever">')}${field('Treatment plan *', '<input name="plan" placeholder="e.g. Rest, fluids, medicines as prescribed">')}</div></div>
    <div class="card"><div class="ch"><h3>Prescription</h3><button class="btn s" onclick="ST.rxRows=Math.min(6,(ST.rxRows||1)+1);A.keepForm()">Add medicine</button></div><div class="cb" style="display:grid;gap:10px">
      ${[...Array(rows)].map((_, i) => `<div class="form" style="grid-template-columns:2fr 1fr 1.2fr .7fr .7fr">${field('Medicine', `<select name="med${i}"><option value="">None</option>${opt(db.medicines, m => m.id, m => m.name)}</select>`)}${field('Dose', `<input name="dose${i}" value="1 tablet">`)}${field('Frequency', `<select name="freq${i}"><option>Once daily</option><option selected>Twice daily</option><option>Three times daily</option><option>At night</option><option>As needed</option></select>`)}${field('Days', `<input name="days${i}" type="number" min="1" value="5">`)}${field('Qty', `<input name="qty${i}" type="number" min="1" value="10">`)}</div>`).join('')}
      <div class="sm mut">Allergy on file: <b>${esc(p.allergies)}</b></div></div></div>
    <div class="card"><div class="ch"><h3>Lab tests and follow-up</h3></div><div class="cb"><div class="pills" style="margin-bottom:12px">${db.labTests.map(t => `<label style="display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink);font-weight:500"><input type="checkbox" name="labs" value="${t.code}" style="width:auto"> ${esc(t.name)} (${money(t.price)})</label>`).join('')}</div>
      <div class="form">${field('Follow-up date', `<input type="date" name="followup" min="${addDays(1)}">`)}</div></div></div>
    <div class="row"><button class="btn p" onclick="A.finishConsult('${id}')">Complete consultation</button><button class="btn" onclick="A.go('opd')">Save later</button></div>
  </div>
  <div class="grid" style="align-content:start"><div class="card"><div class="ch"><h3>Patient background</h3></div><div class="cb"><dl class="kv"><dt>Allergies</dt><dd>${esc(p.allergies)}</dd><dt>History</dt><dd>${esc(p.history)}</dd><dt>Blood group</dt><dd>${esc(p.bloodGroup)}</dd></dl></div></div>
    <div class="card"><div class="ch"><h3>Previous visits</h3></div>${old.length ? old.map(o => `<div class="cb" style="border-bottom:1px solid var(--line)"><b>${esc(o.diagnosis)}</b><div class="sm mut">${fdate(o.date)} - ${esc(DOC(o.doctor).name)}</div></div>`).join('') : empty('First visit', 'No earlier visits on record.')}</div></div></div>`;
};
def('keepForm', () => { const f = fv('cf'); render(); Object.entries(f).forEach(([k, v]) => { const el = document.querySelector('#cf [name="' + k + '"]'); if (el && el.type !== 'checkbox') el.value = v; else if (el && Array.isArray(v)) { document.querySelectorAll('#cf [name="labs"]').forEach(c => c.checked = v.includes(c.value)); } }); });
def('finishConsult', id => {
  need('consult'); const f = fv('cf'); const a = byId(db.appointments, id);
  if (!f.symptoms) throw new VErr('Enter the symptoms.'); if (!f.diagnosis) throw new VErr('Enter a diagnosis.'); if (!f.plan) throw new VErr('Enter a treatment plan.');
  if (!/^\d{2,3}\/\d{2,3}$/.test(f.bp)) throw new VErr('Enter blood pressure like 120/80 (nurse or doctor can record it).');
  const items = []; for (let i = 0; i < 6; i++) { if (f['med' + i]) { const q = +f['qty' + i], d = +f['days' + i]; if (!(q > 0) || !(d > 0)) throw new VErr('Enter quantity and days for each medicine.'); items.push({ med:f['med' + i], dose:f['dose' + i], freq:f['freq' + i], days:d, qty:q }); } }
  const visit = { id:nextId(db, 'visit'), patient:a.patient, doctor:a.doctor, appt:a.id, date:todayStr(), symptoms:f.symptoms, vitals:{ bp:f.bp, pulse:+f.pulse || 0, temp:+f.temp || 0, spo2:+f.spo2 || 0, weight:+f.weight || 0 }, notes:f.notes || '-', diagnosis:f.diagnosis, plan:f.plan, followUp:f.followup || null };
  db.visits.push(visit); a.visit = visit.id; a.status = 'Completed';
  if (items.length) db.prescriptions.push({ id:nextId(db, 'rx'), visit:visit.id, patient:a.patient, doctor:a.doctor, date:todayStr(), status:'Pending', items });
  if (f.labs && f.labs.length) db.labOrders.push({ id:nextId(db, 'lab'), patient:a.patient, doctor:a.doctor, visit:visit.id, date:todayStr(), status:'Ordered', tests:f.labs.map(c => { const t = db.labTests.find(x => x.code === c); return { code:c, name:t.name, price:t.price, result:'', flag:'' }; }), verifiedBy:'' });
  if (f.followup) db.appointments.push({ id:nextId(db, 'appointment'), patient:a.patient, doctor:a.doctor, date:f.followup, time:'10:00', type:'Scheduled', reason:'Follow-up: ' + f.diagnosis, status:'Booked', token:null, visit:null, createdAt:todayStr() });
  audit('Consultation completed', visit.id + ' for ' + a.patient); save(); route = { m:'opd', p:{} }; render();
  toast('Consultation saved' + (items.length ? ', prescription created' : '') + (f.labs && f.labs.length ? ', lab order sent' : ''), 'ok'); A.visitSummary(visit.id);
});
def('visitSummary', id => {
  const v = byId(db.visits, id); const p = P(v.patient); const rx = db.prescriptions.find(x => x.visit === id); const lo = db.labOrders.filter(x => x.visit === id);
  showDoc('Visit summary', `${docHead('Visit summary')}<table><tr><td>Patient</td><td><b>${esc(p.name)}</b> (${p.id})</td><td>Date</td><td>${fdate(v.date)}</td></tr><tr><td>Age / sex</td><td>${age(p.dob)} / ${esc(p.gender)}</td><td>Doctor</td><td>${esc(DOC(v.doctor).name)}</td></tr></table>
  <p><b>Vitals:</b> BP ${esc(v.vitals.bp)}, pulse ${v.vitals.pulse}/min, temperature ${v.vitals.temp} F, SpO2 ${v.vitals.spo2}%, weight ${v.vitals.weight} kg</p><p><b>Symptoms:</b> ${esc(v.symptoms)}</p><p><b>Examination:</b> ${esc(v.notes)}</p><p><b>Diagnosis:</b> ${esc(v.diagnosis)}</p><p><b>Treatment plan:</b> ${esc(v.plan)}</p>
  ${rx ? `<b>Prescription ${rx.id}</b><table><tr><th>Medicine</th><th>Dose</th><th>Frequency</th><th>Days</th><th>Qty</th></tr>${rx.items.map(i => `<tr><td>${esc(byId(db.medicines, i.med).name)}</td><td>${esc(i.dose)}</td><td>${esc(i.freq)}</td><td>${i.days}</td><td>${i.qty}</td></tr>`).join('')}</table>` : ''}
  ${lo.length ? `<p><b>Lab tests ordered:</b> ${lo.map(l => esc(l.id) + ' (' + esc(l.tests.map(t => t.name).join(', ')) + ')').join('; ')}</p>` : ''}${v.followUp ? `<p><b>Follow-up:</b> ${fdate(v.followUp)}</p>` : ''}<div class="sig"><span>Patient signature</span><span>${esc(DOC(v.doctor).name)}</span></div>`);
});
def('printRx', id => {
  const x = byId(db.prescriptions, id); const p = P(x.patient);
  showDoc('Prescription', `${docHead('Prescription ' + x.id)}<p><b>${esc(p.name)}</b> (${p.id}), ${age(p.dob)} yrs, ${esc(p.gender)} | Allergies: ${esc(p.allergies)}</p><table><tr><th>Medicine</th><th>Dose</th><th>Frequency</th><th>Days</th><th>Qty</th></tr>${x.items.map(i => `<tr><td>${esc(byId(db.medicines, i.med).name)}</td><td>${esc(i.dose)}</td><td>${esc(i.freq)}</td><td>${i.days}</td><td>${i.qty}</td></tr>`).join('')}</table><div class="sig"><span>${fdate(x.date)}</span><span>${esc(DOC(x.doctor).name)}</span></div>`, false);
});

/* ---------------- doctors and staff ---------------- */
VIEWS.staff = () => {
  const tab = ST.stab || 'doctors'; const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  let body;

  else if (tab === 'staff') body = table(['Staff ID', 'Name', 'Role', 'Department', 'Shift', 'Phone'], db.staff.map(s => [`<span class="mono">${s.id}</span>`, esc(s.name), esc(ROLES[s.role].label), esc(s.dept), esc(s.shift), esc(s.phone)]));

def('newStaff', () => { need('staff.manage'); openModal({ title:'Add staff member', body:`<div id="sf" class="form">${field('Full name *', '<input name="name">')}${field('Role *', `<select name="role">${Object.keys(ROLES).filter(r => r !== 'doctor').map(r => `<option value="${r}">${ROLES[r].label}</option>`).join('')}</select>`)}${field('Department', '<input name="dept">')}${field('Shift', '<select name="shift"><option>Day</option><option>Evening</option><option>Night</option></select>')}${field('Phone', '<input name="phone">')}</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.saveStaff()">Add staff member</button>` }); });
def('saveStaff', () => { need('staff.manage'); const f = fv('sf'); if (f.name.length < 3) throw new VErr('Enter the staff member\'s name.'); const s = { id:nextId(db, 'staff'), name:f.name, role:f.role, dept:f.dept || '-', shift:f.shift, phone:f.phone || '-', active:true }; db.staff.push(s); audit('Staff added', s.id); closeModal(); commit('Added ' + s.name + ' as ' + s.id); });

/* ===== views 2: IPD/beds, laboratory, pharmacy, inventory, billing, reports, audit ===== */

/* ---------------- IPD and beds ---------------- */
const bedIsFree = id => { const b = BED(id); return b.status === 'free' && !db.admissions.some(a => a.status === 'Admitted' && a.bed === id); };
VIEWS.ipd = () => {
  const tab = ST.itab || 'beds'; let body = '';
  if (tab === 'beds') body = db.wards.map(w => { const bs = db.beds.filter(b => b.ward === w.id); const occ = bs.filter(b => b.status === 'occupied').length;
    return `<div class="ward card"><div class="ch"><h3>${esc(w.name)}</h3><span class="sm mut">${occ} of ${bs.length} occupied | ${money(w.rate)} per day</span></div><div class="cb"><div class="beds">${bs.map(b => {
      const ad = db.admissions.find(a => a.status === 'Admitted' && a.bed === b.id);
      if (ad) return `<div class="bed occ"><b>${esc(b.label)}</b><div>${esc(P(ad.patient).name)}</div><div class="sm mut">${ad.patient}</div><div class="row" style="margin-top:6px"><button class="btn s" onclick="A.admDetail('${ad.id}')">Open</button></div></div>`;
      if (b.status === 'maintenance') return `<div class="bed mnt"><b>${esc(b.label)}</b><div>Under maintenance</div></div>`;
      return `<div class="bed free" onclick="A.admit('', '${b.id}')" role="button" tabindex="0"><b>${esc(b.label)}</b><div class="mut">Available</div>${can('ipd.admit') ? '<div class="sm" style="color:var(--teal-d)">Click to admit</div>' : ''}</div>`; }).join('')}</div></div></div>`; }).join('');
  if (tab === 'adm') { const l = db.admissions.slice().sort((a, b) => (b.admittedAt).localeCompare(a.admittedAt)); body = `<div class="card">${table(['Admission', 'Patient', 'Doctor', 'Bed', 'Admitted', 'Diagnosis', 'Status', ''], l.map(a => [`<span class="mono">${a.id}</span>`, pLink(a.patient), esc(DOC(a.doctor).name), esc(bedName(a.bed)), fdate(a.admittedAt), esc(a.diagnosis), badge(a.status), `<button class="btn s" onclick="A.admDetail('${a.id}')">Open</button>`]), 'No admissions yet')}</div>`; }
  if (tab === 'wards') body = `<div class="card">${table(['Ward / room type', 'Beds', 'Occupied', 'Available', 'Charge per day', 'Occupancy'], db.wards.map(w => { const bs = db.beds.filter(b => b.ward === w.id); const o = bs.filter(b => b.status === 'occupied').length; const pct = Math.round(100 * o / bs.length); return [`<b>${esc(w.name)}</b>`, bs.length, o, bs.filter(b => b.status === 'free').length, money(w.rate), `<div class="bar ${pct > 85 ? 'd' : pct > 60 ? 'w' : ''}" style="min-width:120px"><i style="width:${pct}%"></i></div><span class="sm mut">${pct}%</span>`]; }))}</div>`;
  return `<div class="head"><div><h1>IPD and bed management</h1><p>${activeAdm().length} patients admitted. A bed can hold only one active patient.</p></div>${can('ipd.admit') ? `<button class="btn p" onclick="A.admit('')">Admit patient</button>` : ''}</div>
  ${tabs([['beds', 'Bed map'], ['adm', 'Admissions'], ['wards', 'Wards and rooms']], tab, 'A.itab')}${body}`;
};
def('itab', t => { ST.itab = t; render(); });
def('admit', (pid, bedId) => {
  need('ipd.admit'); const admitted = new Set(activeAdm().map(a => a.patient));
  const free = db.beds.filter(b => bedIsFree(b.id));
  if (!free.length) throw new VErr('No beds are free right now.');
  openModal({ title:'Admit patient', body:`<div id="adf" class="form">${field('Patient *', `<select name="patient"><option value="">Select patient</option>${opt(db.patients.filter(p => !admitted.has(p.id)), p => p.id, p => p.id + '  ' + p.name, pid)}</select>`, 'full')}
    ${field('Attending doctor *', `<select name="doctor">${opt(db.doctors, d => d.id, d => d.name + ' - ' + deptName(d.dept), session.doctorId)}</select>`, 'full')}
    ${field('Bed *', `<select name="bed">${opt(free, b => b.id, b => bedName(b.id) + ' (' + money(BED(b.id).rate) + '/day)', bedId)}</select>`, 'full')}
    ${field('Reason for admission *', '<input name="diagnosis" placeholder="e.g. Pneumonia, observation">', 'full')}</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.saveAdmit()">Admit patient</button>` });
});
def('saveAdmit', () => {
  need('ipd.admit'); const f = fv('adf');
  if (!f.patient) throw new VErr('Select a patient.'); if (!f.diagnosis) throw new VErr('Enter the reason for admission.');

function labActions(o) {
  const b = [];
  if (o.status === 'Ordered' && can('lab.process')) b.push(`<button class="btn s p" onclick="A.labStep('${o.id}','Sample collected')">Collect sample</button>`);
  if (o.status === 'Sample collected' && can('lab.process')) b.push(`<button class="btn s p" onclick="A.labStep('${o.id}','Processing')">Start processing</button>`);

}

VIEWS.pharmacy = () => {
  const tab = ST.phtab || 'dispense'; let body = '';
  if (tab === 'dispense') { const l = db.prescriptions.filter(x => x.status === 'Pending'); body = `<div class="card"><div class="ch"><h3>Prescriptions waiting (${l.length})</h3></div>${table(['Prescription', 'Patient', 'Doctor', 'Medicines', ''], l.map(x => [`<span class="mono b">${x.id}</span><div class="sm mut">${fdate(x.date)}</div>`, pLink(x.patient), esc(DOC(x.doctor).name), x.items.map(i => esc(byId(db.medicines, i.med).name) + ' x' + i.qty).join('<br>'), `<button class="btn s p" onclick="A.dispense('${x.id}')">Dispense</button>`]), 'No prescriptions waiting', 'New prescriptions from doctors appear here.')}</div>`; }
  if (tab === 'stock') body = `<div class="card"><div class="ch"><h3>Medicine stock</h3>${can('pharm.stock') ? `<button class="btn s p" onclick="A.addBatch()">Add stock batch</button>` : ''}</div>${table(['Medicine', 'Category', 'Price', 'In stock', 'Reorder at', 'Nearest expiry', 'Status'], db.medicines.map(m => { const q = medStock(m.id); const bs = db.batches.filter(b => b.med === m.id && b.qty > 0).sort((a, b) => a.expiry.localeCompare(b.expiry)); const low = q <= m.reorder; return [`<b>${esc(m.name)}</b><div class="sm mut">${esc(m.form)}</div>`, esc(m.category), money(m.price), `<b class="mono">${q}</b>`, m.reorder, bs[0] ? fdate(bs[0].expiry) : '-', low ? '<span class="badge bad">Low stock</span>' : '<span class="badge ok">OK</span>']; }))}</div>`;
  if (tab === 'batches') body = `<div class="card">${table(['Medicine', 'Batch', 'Expiry', 'Qty', 'Status'], db.batches.slice().sort((a, b) => a.expiry.localeCompare(b.expiry)).map(b => { const d = Math.round((new Date(b.expiry) - TODAY) / 864e5); return [esc(byId(db.medicines, b.med).name), `<span class="mono">${esc(b.batchNo)}</span>`, fdate(b.expiry), b.qty, d < 0 ? '<span class="badge bad">Expired</span>' : d <= 60 ? `<span class="badge warn">Expires in ${d} days</span>` : '<span class="badge ok">Valid</span>']; }))}</div>`;
  if (tab === 'sales') body = `<div class="card"><div class="ch"><h3>Dispensing and sales</h3><button class="btn s p" onclick="A.otc()">New counter sale</button></div>${table(['Sale', 'Date', 'Patient / customer', 'Items', 'Amount', 'Billing'], db.sales.slice().reverse().map(s => [`<span class="mono">${s.id}</span>`, fdate(s.date), s.patient ? pLink(s.patient) : esc(s.customer), esc(s.lines.map(l => l.name + ' x' + l.qty).join(', ')), money(s.total), s.rx ? '<span class="badge info">Added to invoice</span>' : '<span class="badge ok">Paid at counter</span>']), 'No sales yet', 'Dispense a prescription or make a counter sale.')}</div>`;
  if (tab === 'suppliers') body = `<div class="card">${table(['Supplier', 'Type', 'Phone', 'Medicines supplied'], db.suppliers.filter(s => s.type === 'Medicine').map(s => [esc(s.name), s.type, esc(s.phone), db.medicines.filter(m => m.supplier === s.id).length]))}</div>`;
  return `<div class="head"><div><h1>Pharmacy</h1><p>Batch and expiry tracking, prescription dispensing and counter sales.</p></div></div>${tabs([['dispense', 'Dispense (' + db.prescriptions.filter(x => x.status === 'Pending').length + ')'], ['stock', 'Stock'], ['batches', 'Batches and expiry'], ['sales', 'Sales'], ['suppliers', 'Suppliers']], tab, 'A.phtab')}${body}`;
};
def('phtab', t => { ST.phtab = t; render(); });
/* takes stock from the earliest-expiring valid batches first; returns false if not enough */
function takeStock(medId, qty, commitIt) {
  const bs = db.batches.filter(b => b.med === medId && b.qty > 0 && b.expiry >= todayStr()).sort((a, b) => a.expiry.localeCompare(b.expiry)); let need = qty; const plan = [];
  for (const b of bs) { const t = Math.min(b.qty, need); if (t > 0) { plan.push([b, t]); need -= t; } if (!need) break; }
  if (need > 0) return false; if (commitIt) plan.forEach(([b, t]) => b.qty -= t); return true;
}
def('dispense', id => {
  need('rx.dispense'); const x = byId(db.prescriptions, id); const p = P(x.patient);
  const rows = x.items.map(i => { const m = byId(db.medicines, i.med); const have = medStock(m.id); return { m, i, have, ok:have >= i.qty }; });
  openModal({ title:'Dispense ' + id, wide:true, noFocus:true, body:`<p><b>${esc(p.name)}</b> (${p.id}) | Allergy on file: <b>${esc(p.allergies)}</b></p>${table(['Medicine', 'Prescribed', 'In stock', 'Price', 'Amount', ''], rows.map(r => [esc(r.m.name), r.i.qty + ' (' + esc(r.i.freq) + ', ' + r.i.days + ' days)', r.have, money(r.m.price), money(r.m.price * r.i.qty), r.ok ? '<span class="badge ok">Available</span>' : '<span class="badge bad">Short by ' + (r.i.qty - r.have) + '</span>']))}<div class="note" style="margin-top:12px">Stock is taken from the batch that expires first. The amount is added to this patient's invoice.</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" ${rows.every(r => r.ok) ? '' : 'disabled'} onclick="A.doDispense('${id}')">Confirm dispensing</button>` });
});
def('doDispense', id => {
  need('rx.dispense'); const x = byId(db.prescriptions, id); if (x.status !== 'Pending') throw new VErr('This prescription was already dispensed.');
  for (const i of x.items) if (!takeStock(i.med, i.qty, false)) throw new VErr('Not enough stock for ' + byId(db.medicines, i.med).name + '.');
  const lines = x.items.map(i => { takeStock(i.med, i.qty, true); const m = byId(db.medicines, i.med); return { med:m.id, name:m.name, qty:i.qty, price:m.price }; });
  const s = { id:nextId(db, 'sale'), date:todayStr(), patient:x.patient, rx:x.id, visit:x.visit, lines, total:sum(lines, l => l.qty * l.price) }; db.sales.push(s); x.status = 'Dispensed';
  audit('Prescription dispensed', x.id + ' ' + money(s.total)); closeModal(); ST.phtab = 'dispense'; commit('Dispensed ' + x.id + '. Stock updated. ' + money(s.total) + ' added to billing.');
  lowMeds().filter(m => lines.some(l => l.med === m.id)).forEach(m => toast('Low stock alert: ' + m.name, 'err'));
});
def('otc', () => { need('rx.dispense'); openModal({ title:'Counter sale', body:`<div id="of" class="form">${field('Customer name', '<input name="customer" value="Walk-in customer">', 'full')}${field('Medicine *', `<select name="med">${opt(db.medicines, m => m.id, m => m.name + ' - ' + money(m.price) + ' (stock ' + medStock(m.id) + ')')}</select>`, 'full')}${field('Quantity *', '<input name="qty" type="number" min="1" value="1">')}${field('Payment method (simulated)', '<select name="method"><option>Cash</option><option>UPI</option><option>Card</option></select>')}</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.saveOtc()">Complete sale</button>` }); });
def('saveOtc', () => { need('rx.dispense'); const f = fv('of'); const q = +f.qty; if (!(q > 0)) throw new VErr('Enter a quantity.'); const m = byId(db.medicines, f.med); if (!takeStock(m.id, q, true)) throw new VErr('Only ' + medStock(m.id) + ' of ' + m.name + ' in stock.'); const s = { id:nextId(db, 'sale'), date:todayStr(), patient:null, customer:f.customer || 'Walk-in customer', rx:null, lines:[{ med:m.id, name:m.name, qty:q, price:m.price }], total:q * m.price }; db.sales.push(s); db.payments.push({ id:nextId(db, 'pay'), invoice:null, sale:s.id, amount:s.total, method:f.method, at:todayStr(), ref:'SIM-' + Math.floor(100000 + Math.random() * 899999), type:'payment' }); audit('Counter sale', s.id); closeModal(); ST.phtab = 'sales'; commit('Sale ' + s.id + ' complete: ' + money(s.total) + ' (simulated ' + f.method + ')'); });
def('addBatch', () => { need('pharm.stock'); openModal({ title:'Add stock batch', body:`<div id="bf" class="form">${field('Medicine *', `<select name="med">${opt(db.medicines, m => m.id, m => m.name)}</select>`, 'full')}${field('Batch number *', '<input name="batchNo">')}${field('Expiry date *', `<input type="date" name="expiry" min="${addDays(1)}">`)}${field('Quantity *', '<input type="number" name="qty" min="1">')}</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.saveBatch()">Add to stock</button>` }); });

  if (tab === 'items') body = `<div class="card"><div class="ch"><h3>Supplies and equipment</h3>${can('inv.manage') ? `<button class="btn s p" onclick="A.newItem()">Add item</button>` : ''}</div>${table(['Item ID', 'Item', 'Category', 'In stock', 'Minimum', 'Status', ''], db.items.map(i => [`<span class="mono">${i.id}</span>`, `<b>${esc(i.name)}</b>`, esc(i.category), `<b class="mono">${i.qty}</b> ${esc(i.unit)}`, i.min, i.qty <= i.min ? '<span class="badge bad">Reorder</span>' : '<span class="badge ok">OK</span>', `<div class="row"><button class="btn s" onclick="A.itemLabel('${i.id}')">QR label</button>${can('inv.manage') ? `<button class="btn s" onclick="A.stockMove('${i.id}','in')">Stock in</button><button class="btn s" onclick="A.stockMove('${i.id}','out')">Issue</button>` : ''}</div>`]))}</div>`;

  if (tab === 'po') body = `<div class="card"><div class="ch"><h3>Purchase orders</h3>${can('inv.manage') ? `<button class="btn s p" onclick="A.newPO()">New purchase order</button>` : ''}</div>${table(['PO', 'Date', 'Supplier', 'Items', 'Total', 'Status', ''], db.pos.slice().reverse().map(p => [`<span class="mono">${p.id}</span>`, fdate(p.at), esc(sup(p.supplier)), esc(p.lines.map(l => (byId(db.items, l.item) || {}).name + ' x' + l.qty).join(', ')), money(p.total), badge(p.status), p.status === 'Ordered' && can('inv.manage') ? `<button class="btn s p" onclick="A.receivePO('${p.id}')">Mark received</button>` : '']), 'No purchase orders')}</div>`;
  if (tab === 'sup') body = `<div class="card">${table(['Supplier', 'Type', 'Phone'], db.suppliers.map(s => [esc(s.name), s.type, esc(s.phone)]))}</div>`;
  return `<div class="head"><div><h1>Inventory</h1><p>Hospital supplies and equipment, with department-wise issues and a full movement history.</p></div></div>${tabs([['items', 'Items'], ['moves', 'Movement history'], ['po', 'Purchase orders'], ['sup', 'Suppliers']], tab, 'A.vtab')}${body}`;
};
def('vtab', t => { ST.vtab = t; render(); });
const mvId = () => 'MV' + String(db.seq.mv = (db.seq.mv || 0) + 1).padStart(5, '0');
def('itemLabel', id => { const i = byId(db.items, id); openModal({ title:'Inventory label', noFocus:true, body:`<div class="idcard" style="width:300px"><div class="top">${roseSvg(26)}<div><b>${esc(db.hospital.name)}</b><span>Inventory label (demo)</span></div></div><div class="mid"><div class="qr" style="width:96px;height:96px">${qrSvg('WR://item/' + i.id)}</div><div><div class="pid mono" style="font-size:15px">${i.id}</div><div class="b">${esc(i.name)}</div><div class="sm mut">${esc(i.category)}</div></div></div></div>`, footer:`<button class="btn n" onclick="window.print()">Print label</button>` }); });
def('stockMove', (id, type) => { need('inv.manage'); const i = byId(db.items, id); openModal({ title:(type === 'in' ? 'Stock in: ' : 'Issue: ') + i.name, body:`<p class="mut" style="margin-top:0">Current stock: <b>${i.qty} ${esc(i.unit)}</b></p><div id="mf" class="form">${field('Quantity *', '<input name="qty" type="number" min="1">')}${type === 'out' ? field('Issue to department *', `<select name="dept">${opt(db.departments, d => d.name, d => d.name)}<option>ICU</option><option>Operation theatre</option><option>Laboratory</option><option>Pharmacy</option></select>`) : field('Reference', '<input name="ref" placeholder="Invoice or note">')}</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.saveMove('${id}','${type}')">${type === 'in' ? 'Add stock' : 'Issue stock'}</button>` }); });
def('saveMove', (id, type) => { need('inv.manage'); const f = fv('mf'); const q = +f.qty; const i = byId(db.items, id); if (!(q > 0)) throw new VErr('Enter a quantity.'); if (type === 'out' && q > i.qty) throw new VErr('Only ' + i.qty + ' ' + i.unit + ' in stock. You cannot issue more than that.'); i.qty += type === 'in' ? q : -q; db.stockMoves.push({ id:mvId(), item:id, type, qty:q, dept:type === 'out' ? f.dept : '', ref:f.ref || '', by:session.name, at:todayStr() }); audit('Inventory ' + type, i.name + ' x' + q); closeModal(); commit((type === 'in' ? 'Added ' : 'Issued ') + q + ' ' + i.unit + ' of ' + i.name + '. Now ' + i.qty); });
def('newItem', () => { need('inv.manage'); openModal({ title:'Add inventory item', body:`<div id="nf" class="form">${field('Item name *', '<input name="name">', 'full')}${field('Category', '<select name="category"><option>Consumables</option><option>Equipment</option><option>Linen</option><option>Office</option></select>')}${field('Unit', '<input name="unit" value="pcs">')}${field('Opening quantity', '<input name="qty" type="number" value="0">')}${field('Minimum level', '<input name="min" type="number" value="10">')}${field('Supplier', `<select name="supplier">${opt(db.suppliers, s => s.id, s => s.name)}</select>`, 'full')}</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.saveItem()">Add item</button>` }); });
def('saveItem', () => { need('inv.manage'); const f = fv('nf'); if (f.name.length < 3) throw new VErr('Enter the item name.'); const i = { id:nextId(db, 'inv'), name:f.name, category:f.category, unit:f.unit || 'pcs', qty:+f.qty || 0, min:+f.min || 0, supplier:f.supplier }; db.items.push(i); audit('Inventory item added', i.id); closeModal(); commit('Item ' + i.id + ' added'); });
def('newPO', () => { need('inv.manage'); openModal({ title:'New purchase order', body:`<div id="pf2" class="form">${field('Supplier *', `<select name="supplier">${opt(db.suppliers, s => s.id, s => s.name)}</select>`, 'full')}${field('Item *', `<select name="item">${opt(db.items, i => i.id, i => i.name)}</select>`, 'full')}${field('Quantity *', '<input type="number" name="qty" min="1">')}${field('Unit cost *', '<input type="number" name="cost" min="0" step="0.5">')}</div>`, footer:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="A.savePO()">Place order</button>` }); });
def('savePO', () => { need('inv.manage'); const f = fv('pf2'); if (!(+f.qty > 0) || !(+f.cost > 0)) throw new VErr('Enter a quantity and a unit cost.'); const p = { id:nextId(db, 'po'), supplier:f.supplier, status:'Ordered', at:todayStr(), lines:[{ item:f.item, qty:+f.qty, cost:+f.cost }], total:+f.qty * +f.cost }; db.pos.push(p); audit('Purchase order placed', p.id); closeModal(); commit('Purchase order ' + p.id + ' placed'); });
def('receivePO', id => { need('inv.manage'); const p = byId(db.pos, id); if (p.status !== 'Ordered') throw new VErr('This order was already received.'); p.lines.forEach(l => { byId(db.items, l.item).qty += l.qty; db.stockMoves.push({ id:mvId(), item:l.item, type:'in', qty:l.qty, dept:'', ref:p.id, by:session.name, at:todayStr() }); }); p.status = 'Received'; audit('Purchase order received', id); commit(id + ' received and stock updated'); });

/* ---------------- billing ---------------- */
VIEWS.billing = () => {
  const tab = ST.btab || 'invoices'; const flt = ST.bflt || 'All'; let body = '';
  if (tab === 'invoices') { const l = db.invoices.filter(i => flt === 'All' || (flt === 'Outstanding' ? balance(i) > 0 : i.status === flt)).sort((a, b) => b.id.localeCompare(a.id));
    body = `<div class="pills" style="margin-bottom:12px">${['All', 'Paid', 'Partial', 'Pending', 'Outstanding'].map(s => `<button class="pill ${flt === s ? 'on' : ''}" onclick="ST.bflt='${s}';render()">${s}</button>`).join('')}</div><div class="card">${table(['Invoice', 'Patient', 'Date', 'Total', 'Paid', 'Balance', 'Status', ''], l.slice(0, 80).map(i => [`<span class="mono b">${i.id}</span>`, pLink(i.patient), fdate(i.date), money(net(i)), money(i.paid - i.refunded), money(balance(i)), badge(i.status), `<button class="btn s" onclick="A.invoice('${i.id}')">Open</button>`]), 'No invoices match')}</div>`; }
  if (tab === 'ready') { const vs = db.visits.filter(v => !db.invoices.some(i => i.visit === v.id)); const as = db.admissions.filter(a => !db.invoices.some(i => i.admission === a.id));
    body = `<div class="card"><div class="ch"><h3>Consultations not billed (${vs.length})</h3></div>${table(['Visit', 'Patient', 'Doctor', 'Date', ''], vs.map(v => [`<span class="mono">${v.id}</span>`, pLink(v.patient), esc(DOC(v.doctor).name), fdate(v.date), can('bill.create') ? `<button class="btn s p" onclick="A.genInvoice('${v.id}')">Generate invoice</button>` : '']), 'Everything is billed', 'New consultations appear here until an invoice is created.')}</div>
    <div class="card" style="margin-top:16px"><div class="ch"><h3>Admissions not billed (${as.length})</h3></div>${table(['Admission', 'Patient', 'Bed', 'Status', ''], as.map(a => [`<span class="mono">${a.id}</span>`, pLink(a.patient), esc(bedName(a.bed)), badge(a.status), can('bill.create') ? `<button class="btn s p" onclick="A.admInvoice('${a.id}')">Generate invoice</button>` : '']), 'No admissions waiting')}</div>`; }
  if (tab === 'daily') { const d = ST.bday || todayStr(); const ps = db.payments.filter(p => p.at === d); const meth = ['Cash', 'UPI', 'Card', 'Bank transfer'].map(m => ({ m, t:sum(ps.filter(p => p.method === m), p => p.type === 'refund' ? -p.amount : p.amount) }));
    body = `<div class="row" style="margin-bottom:12px"><label style="width:200px">Date<input type="date" value="${d}" onchange="ST.bday=this.value;render()"></label><button class="btn" style="align-self:flex-end" onclick="A.exportDaily()">Export CSV</button></div>
    <div class="grid g4" style="margin-bottom:16px">${meth.map(x => `<div class="card kpi n2"><span class="n mono">${money(x.t)}</span><span class="l">${x.m}</span></div>`).join('')}</div><div class="card"><div class="ch"><h3>Total collected: ${money(collectionsOn(d))}</h3></div>${table(['Receipt', 'Invoice / sale', 'Method', 'Reference', 'Type', 'Amount'], ps.map(p => [`<span class="mono">${p.id}</span>`, esc(p.invoice || p.sale || '-'), esc(p.method), `<span class="mono sm">${esc(p.ref)}</span>`, p.type === 'refund' ? '<span class="badge warn">Refund</span>' : 'Payment', (p.type === 'refund' ? '-' : '') + money(p.amount)]), 'No payments on this date')}</div>`; }
  if (tab === 'refunds') body = `<div class="card">${table(['Receipt', 'Invoice', 'Date', 'Method', 'Amount'], db.payments.filter(p => p.type === 'refund').map(p => [`<span class="mono">${p.id}</span>`, esc(p.invoice), fdate(p.at), esc(p.method), money(p.amount)]), 'No refunds recorded')}</div>`;
  return `<div class="head"><div><h1>Billing and accounts</h1><p>Outstanding: <b>${money(sum(db.invoices, balance))}</b> | Today: <b>${money(collectionsOn(todayStr()))}</b>. All payments are simulated.</p></div></div>${tabs([['invoices', 'Invoices'], ['ready', 'Ready to bill'], ['daily', 'Daily collection'], ['refunds', 'Refunds']], tab, 'A.btab')}${body}`;
};
def('btab', t => { ST.btab = t; render(); });
function buildLines(v) {
  const d = DOC(v.doctor); const lines = [{ desc:'Consultation - ' + d.name, cat:'Consultation', qty:1, price:d.fee }];
  db.labOrders.filter(l => l.visit === v.id).forEach(l => l.tests.forEach(t => lines.push({ desc:'Lab: ' + t.name, cat:'Laboratory', qty:1, price:t.price })));
  db.sales.filter(s => s.visit === v.id).forEach(s => s.lines.forEach(l => lines.push({ desc:'Pharmacy: ' + l.name + ' x' + l.qty, cat:'Pharmacy', qty:1, price:l.qty * l.price })));
  return lines;
}
def('genInvoice', vid => {
  need('bill.create'); const v = byId(db.visits, vid); let inv = db.invoices.find(i => i.visit === vid);
  if (inv) { inv.lines = buildLines(v); inv.total = sum(inv.lines, l => l.qty * l.price); refreshInvoice(inv); audit('Invoice synced', inv.id); save(); render(); return A.invoice(inv.id); }
  const lines = buildLines(v); inv = { id:nextId(db, 'bill'), patient:v.patient, visit:vid, admission:null, date:todayStr(), lines, discount:0, total:sum(lines, l => l.qty * l.price), paid:0, refunded:0, status:'Pending', createdBy:session.name };
  db.invoices.push(inv); audit('Invoice generated', inv.id); save(); render(); toast('Invoice ' + inv.id + ' generated: ' + money(inv.total), 'ok'); A.invoice(inv.id);
});
def('admInvoice', aid => {
  need('bill.create'); const a = byId(db.admissions, aid); const lines = [];
  a.history.forEach(h => { const b = BED(h.bed); const w = byId(db.wards, b.ward); const d = stayDays(h); lines.push({ desc:'Room charge: ' + w.name + ' / ' + b.label + ' (' + d + ' day' + (d > 1 ? 's' : '') + ' x ' + money(b.rate) + ')', cat:'Room', qty:1, price:d * b.rate }); });
  const days = sum(a.history, stayDays); lines.push({ desc:'Doctor visits (' + days + ' days x ' + money(600) + ')', cat:'Consultation', qty:1, price:days * 600 }, { desc:'Nursing care (' + days + ' days x ' + money(400) + ')', cat:'Nursing', qty:1, price:days * 400 });
  let inv = db.invoices.find(i => i.admission === aid);
  if (inv) { inv.lines = lines; inv.total = sum(lines, l => l.price); refreshInvoice(inv); } else { inv = { id:nextId(db, 'bill'), patient:a.patient, visit:null, admission:aid, date:todayStr(), lines, discount:0, total:sum(lines, l => l.price), paid:0, refunded:0, status:'Pending', createdBy:session.name }; db.invoices.push(inv); }
  audit('Admission invoice', inv.id); save(); closeModal(); render(); toast('Invoice ' + inv.id + ': ' + money(inv.total), 'ok'); A.invoice(inv.id);
});
def('invoice', id => {
  const i = byId(db.invoices, id); const p = P(i.patient); const pays = db.payments.filter(x => x.invoice === id); const bal = balance(i);
  openModal({ title:'Invoice ' + id, wide:true, noFocus:true, body:`<div class="doc">${docHead('Invoice ' + id)}<p><b>${esc(p.name)}</b> (${p.id}) | ${age(p.dob)} yrs, ${esc(p.gender)} | ${fdate(i.date)}</p>
    <table><tr><th>Description</th><th>Category</th><th class="r">Amount</th></tr>${i.lines.map(l => `<tr><td>${esc(l.desc)}</td><td>${esc(l.cat)}</td><td class="r">${money(l.qty * l.price)}</td></tr>`).join('')}</table>
    <table class="tot"><tr><td>Subtotal</td><td class="r">${money(i.total)}</td></tr>${i.discount ? `<tr><td>Discount</td><td class="r">-${money(i.discount)}</td></tr>` : ''}<tr><td><b>Net amount</b></td><td class="r"><b>${money(net(i))}</b></td></tr><tr><td>Paid</td><td class="r">${money(i.paid)}</td></tr>${i.refunded ? `<tr><td>Refunded</td><td class="r">${money(i.refunded)}</td></tr>` : ''}<tr><td><b>Balance due</b></td><td class="r"><b>${money(bal)}</b></td></tr></table>
    ${pays.length ? `<b>Payments</b><table><tr><th>Receipt</th><th>Date</th><th>Method</th><th>Reference</th><th class="r">Amount</th></tr>${pays.map(x => `<tr><td>${x.id}</td><td>${fdate(x.at)}</td><td>${esc(x.method)}</td><td>${esc(x.ref)}</td><td class="r">${x.type === 'refund' ? '-' : ''}${money(x.amount)}</td></tr>`).join('')}</table>` : ''}
    <p class="sm">Status: <b>${i.status}</b>. ${esc(db.hospital.invoiceNote)} GSTIN: ${esc(db.hospital.gstin)}</p>${docFoot}</div>`,
    footer:`${bal > 0 && can('bill.pay') ? `<button class="btn p" onclick="A.pay('${id}')">Record payment</button>` : ''}${i.paid - i.refunded > 0 && can('bill.refund') ? `<button class="btn d" onclick="A.refund('${id}')">Refund</button>` : ''}${can('bill.create') && i.visit && !i.paid ? `<button class="btn" onclick="A.genInvoice('${i.visit}')">Sync charges</button>` : ''}<button class="btn n" onclick="window.print()">Print / Save as PDF</button>` });
});
def('pay', id => { need('bill.pay'); const i = byId(db.invoices, id); const bal = balance(i); openModal({ title:'Record payment (simulated)', body:`<div class="note warn" style="margin-bottom:12px">Demo only. No real money moves and no payment gateway is called.</div><p>Balance due on ${id}: <b>${money(bal)}</b></p><div id="pyf" class="form">${field('Amount *', `<input name="amount" type="number" min="1" max="${bal}" step="0.01" value="${bal}">`)}${field('Method *', '<select name="method"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option></select>')}</div>`, footer:`<button class="btn" onclick="closeModal();A.invoice('${id}')">Back</button><button class="btn p" onclick="A.savePay('${id}')">Record payment</button>` }); });
def('savePay', id => { need('bill.pay'); const f = fv('pyf'); const i = byId(db.invoices, id); const amt = Math.round(+f.amount * 100) / 100; const bal = balance(i); if (!(amt > 0)) throw new VErr('Enter an amount.'); if (amt > bal + 0.001) throw new VErr('The amount is more than the balance of ' + money(bal) + '.'); const pm = { id:nextId(db, 'pay'), invoice:id, amount:amt, method:f.method, at:todayStr(), ref:'SIM-' + Math.floor(100000 + Math.random() * 899999), type:'payment' }; db.payments.push(pm); i.paid += amt; refreshInvoice(i); audit('Payment recorded (simulated)', id + ' ' + money(amt) + ' ' + f.method); save(); render(); toast('Receipt ' + pm.id + ': ' + money(amt) + ' via ' + f.method + ' (simulated)', 'ok'); A.invoice(id); });
def('refund', id => { need('bill.refund'); const i = byId(db.invoices, id); const max = i.paid - i.refunded; openModal({ title:'Refund (simulated)', body:`<p>Refundable on ${id}: <b>${money(max)}</b></p><div id="rff" class="form">${field('Amount *', `<input name="amount" type="number" min="1" max="${max}" value="${max}">`)}${field('Method', '<select name="method"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option></select>')}${field('Reason *', '<input name="why">', 'full')}</div>`, footer:`<button class="btn" onclick="closeModal();A.invoice('${id}')">Back</button><button class="btn d" onclick="A.saveRefund('${id}')">Record refund</button>` }); });
def('saveRefund', id => { need('bill.refund'); const f = fv('rff'); const i = byId(db.invoices, id); const amt = +f.amount; if (!f.why) throw new VErr('Enter a reason for the refund.'); if (!(amt > 0) || amt > i.paid - i.refunded) throw new VErr('Refund must be more than 0 and not more than ' + money(i.paid - i.refunded) + '.'); db.payments.push({ id:nextId(db, 'pay'), invoice:id, amount:amt, method:f.method, at:todayStr(), ref:f.why, type:'refund' }); i.refunded += amt; refreshInvoice(i); audit('Refund recorded', id + ' ' + money(amt)); save(); render(); toast('Refund of ' + money(amt) + ' recorded', 'ok'); A.invoice(id); });
def('exportDaily', () => { const d = ST.bday || todayStr(); downloadCSV('daily-collection-' + d + '.csv', ['Receipt', 'Invoice/Sale', 'Method', 'Reference', 'Type', 'Amount'], db.payments.filter(p => p.at === d).map(p => [p.id, p.invoice || p.sale, p.method, p.ref, p.type, p.amount])); });

/* ---------------- reports ---------------- */
const REPORTS = {
  appts:{ t:'Patients and appointments', b:() => ({ cols:['Appointment', 'Date', 'Patient ID', 'Patient', 'Doctor', 'Department', 'Type', 'Status'], rows:db.appointments.slice().sort((a, b) => b.date.localeCompare(a.date)).map(a => [a.id, a.date, a.patient, P(a.patient).name, DOC(a.doctor).name, deptName(DOC(a.doctor).dept), a.type, a.status]) }) },
  adm:{ t:'Admissions and discharges', b:() => ({ cols:['Admission', 'Patient ID', 'Patient', 'Doctor', 'Bed', 'Admitted', 'Discharged', 'Status'], rows:db.admissions.map(a => [a.id, a.patient, P(a.patient).name, DOC(a.doctor).name, bedName(a.bed), a.admittedAt, a.dischargedAt || '', a.status]) }) },
  occ:{ t:'Bed occupancy', b:() => ({ cols:['Ward', 'Total beds', 'Occupied', 'Available', 'Maintenance', 'Occupancy %'], rows:db.wards.map(w => { const bs = db.beds.filter(b => b.ward === w.id); const o = bs.filter(b => b.status === 'occupied').length; return [w.name, bs.length, o, bs.filter(b => b.status === 'free').length, bs.filter(b => b.status === 'maintenance').length, Math.round(100 * o / bs.length)]; }) }) },
  rev:{ t:'Revenue and collections', b:() => ({ cols:['Date', 'Receipts', 'Collected (INR)'], rows:[...Array(14)].map((_, i) => addDays(i - 13)).map(d => [d, db.payments.filter(p => p.at === d).length, collectionsOn(d)]) }) },
  out:{ t:'Outstanding bills', b:() => ({ cols:['Invoice', 'Date', 'Patient ID', 'Patient', 'Net (INR)', 'Paid (INR)', 'Balance (INR)', 'Status'], rows:db.invoices.filter(i => balance(i) > 0).map(i => [i.id, i.date, i.patient, P(i.patient).name, net(i), i.paid - i.refunded, balance(i), i.status]) }) },
  ph:{ t:'Pharmacy stock and expiry', b:() => ({ cols:['Medicine', 'Batch', 'Expiry', 'Qty', 'Status'], rows:db.batches.slice().sort((a, b) => a.expiry.localeCompare(b.expiry)).map(b => { const m = byId(db.medicines, b.med); return [m.name, b.batchNo, b.expiry, b.qty, b.expiry < todayStr() ? 'Expired' : b.expiry <= addDays(60) ? 'Expiring' : medStock(m.id) <= m.reorder ? 'Low stock' : 'OK']; }) }) },
  lab:{ t:'Laboratory order status', b:() => ({ cols:['Order', 'Date', 'Patient ID', 'Patient', 'Tests', 'Status'], rows:db.labOrders.map(l => [l.id, l.date, l.patient, P(l.patient).name, l.tests.map(t => t.name).join('; '), l.status]) }) },
};
VIEWS.reports = () => {
  const k = ST.rep || 'appts'; const r = REPORTS[k].b();
  return `<div class="head"><div><h1>Reports</h1><p>Every report can be exported to CSV or printed.</p></div><div class="row"><button class="btn" onclick="A.exportRep()">Export CSV</button><button class="btn n" onclick="A.printRep()">Print</button></div></div>
  <div class="pills" style="margin-bottom:14px">${Object.entries(REPORTS).map(([id, x]) => `<button class="pill ${k === id ? 'on' : ''}" onclick="ST.rep='${id}';render()">${esc(x.t)}</button>`).join('')}</div>
  <div class="card"><div class="ch"><h3>${esc(REPORTS[k].t)}</h3><span class="sm mut">${r.rows.length} rows</span></div>${table(r.cols, r.rows.slice(0, 200).map(x => x.map(c => esc(c))), 'No data for this report')}</div>`;
};
def('exportRep', () => { const k = ST.rep || 'appts'; const r = REPORTS[k].b(); downloadCSV(k + '-report-' + todayStr() + '.csv', r.cols, r.rows); audit('Report exported', REPORTS[k].t); });
def('printRep', () => { const k = ST.rep || 'appts'; const r = REPORTS[k].b(); showDoc(REPORTS[k].t, `${docHead(REPORTS[k].t)}<table><tr>${r.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${r.rows.slice(0, 200).map(x => `<tr>${x.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`); });

/* ---------------- audit log ---------------- */
VIEWS.audit = () => `<div class="head"><div><h1>Audit log</h1><p>Who did what, and when. Access denials are recorded too.</p></div><button class="btn" onclick="A.go('audit')">Refresh</button></div><div class="card">${table(['Time', 'User', 'Role', 'Action', 'Detail'], db.audit.slice(0, 200).map(a => [new Date(a.at).toLocaleString('en-IN'), esc(a.user), esc(a.role), `<b>${esc(a.action)}</b>`, esc(a.detail)]), 'No activity recorded')}</div>`;
</script>
</body></html>
